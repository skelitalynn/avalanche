user nginx;
worker_processes auto;
pid /run/nginx-situationshit.pid;
error_log /var/log/nginx/situationshit.error.log warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log /var/log/nginx/situationshit.access.log;

    server {
        listen 8080;
        server_name _;
        root /var/www/situationshit/current;
        index index.html;
        add_header X-Content-Type-Options nosniff always;

        location = /index.html { add_header Cache-Control "no-cache"; }
        location / { try_files $uri $uri/ =404; }
        location ~ /\. { deny all; }
    }
}
