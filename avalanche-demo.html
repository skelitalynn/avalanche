<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SituationSHIT · 把彼此的期待说清楚</title><style>
:root{--bg:#f8f5ef;--ink:#292b27;--muted:#777b70;--green:#344f42;--lime:#e7ecbd;--line:#deded3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b77742;outline-offset:3px}header{padding:20px 5%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:850;font-size:23px;letter-spacing:-1.4px;color:inherit;text-decoration:none}.brand span{color:#819174}.tag,.pill{font-size:11px;background:var(--lime);padding:5px 10px;border-radius:20px;color:var(--green)}.layout{max-width:1280px;margin:auto;display:grid;grid-template-columns:190px 1fr;min-height:80vh}aside{padding:30px 16px;border-right:1px solid var(--line)}nav{display:grid;gap:7px}nav button{border:0;background:none;text-align:left;padding:12px;color:var(--muted);border-radius:9px}nav button.active{color:white;background:var(--green)}main{padding:42px;min-width:0}h1,h2,p{margin-top:0}h1{font-size:38px;line-height:1.3;letter-spacing:-1px}h2{font-size:20px}.muted,.note{color:var(--muted)}.note{font-size:12px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:20px}.lead{max-width:470px;color:var(--muted);line-height:1.9}.btn{border:1px solid var(--green);background:var(--green);color:white;border-radius:10px;padding:11px 17px;font-weight:650}.btn.secondary{background:transparent;color:var(--green)}button:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{padding:24px;border:1px solid var(--line);background:#fffdf8;border-radius:17px;margin-bottom:18px}.green{background:var(--green);color:white}.lime{background:var(--lime)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.rule{padding:15px 0;border-bottom:1px solid var(--line)}.rule:last-child{border:0}.big{font-size:36px;font-weight:750;line-height:1.3}.unit{font-size:12px;font-weight:400}.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center;padding:20px 0 45px}.hero h1{font-size:clamp(40px,4.7vw,61px);line-height:1.2}.art{height:340px;position:relative;background:#e9eadc;border-radius:48% 48% 18px 18px;overflow:hidden;display:grid;place-items:center}.orb{position:absolute;width:140px;height:185px;border-radius:80px;background:#b6c3a3;left:25px;top:65px;transform:rotate(-18deg)}.orb.two{background:#e8b49f;left:auto;right:25px;top:100px;transform:rotate(18deg)}.orb:after{content:'·  ·';position:absolute;top:35px;left:42px;font-size:38px}.heart{z-index:1;font-size:42px;color:white}.sticker{position:absolute;bottom:28px;background:#fffdf4;padding:12px 18px;transform:rotate(-5deg);border:1px solid var(--line);font-size:12px;box-shadow:4px 5px 0 #d2d4c4}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.steps b{display:block;margin:14px 0 8px}.steps .card{font-size:13px}label{display:block;font-size:13px;margin-bottom:15px}input,textarea{display:block;width:100%;margin-top:7px;border:1px solid #cccfc2;border-radius:9px;padding:11px 12px;background:white;color:var(--ink)}textarea{min-height:85px}details{border-top:1px solid var(--line);padding:14px 0;font-size:12px;color:var(--muted)}summary{cursor:pointer}.tools{margin-top:35px}.tools button{margin-top:10px;width:100%;text-align:left;padding:7px;border:1px solid var(--line);background:none;border-radius:7px}.avatars{display:flex;margin:25px 0}.avatar{width:50px;height:50px;display:grid;place-items:center;border-radius:50%;border:3px solid var(--bg);background:#b6c3a3}.avatar+ .avatar{margin-left:-8px;background:#e8b49f}.timeline{border-left:2px solid #ccd5be;padding-left:20px;margin:20px 0}.timeline p{margin-bottom:23px}.center{text-align:center}.receipt{max-width:560px;margin:auto}footer{border-top:1px solid var(--line);padding:18px 5%;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--green);color:white;padding:14px 20px;border-radius:12px;max-width:90vw;width:max-content;font-size:13px;z-index:10}.toast:empty{display:none}
@media(max-width:950px){.hero{grid-template-columns:1fr}.art{height:260px}.orb{left:20%}.orb.two{right:20%}.steps{grid-template-columns:1fr}main{padding:28px}.layout{grid-template-columns:160px 1fr}}
@media(max-width:600px){header{padding:16px}.brand{font-size:20px}.tag{font-size:9px}.layout{display:block}aside{padding:10px 14px;border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;overflow:auto}nav button{white-space:nowrap;font-size:12px;padding:9px 12px}.tools{margin:8px 0 0}.tools button{width:auto;margin:4px}.grid{grid-template-columns:1fr;gap:0}main{padding:26px 18px}.hero{padding-top:0}.hero h1{font-size:43px}.orb{left:12%}.orb.two{right:12%}h1{font-size:29px}.card{padding:20px}.actions .btn{flex:1}.big{font-size:30px}footer{flex-direction:column}}
.layout{display:block;max-width:1040px}aside{border:0;padding:24px 42px 0}main{padding-top:28px}.progress{list-style:none;display:flex;padding:0;margin:0;gap:14px;justify-content:space-between}.progress li{color:var(--muted);font-size:12px;display:flex;gap:8px;align-items:center}.progress li span{width:25px;height:25px;display:grid;place-items:center;border-radius:50%;background:#e9e9df}.progress .current{color:var(--green);font-weight:750}.progress .current span,.progress .complete span{background:var(--green);color:white}.role{border:1px solid var(--line);border-radius:18px;background:transparent;padding:5px 12px;color:var(--green);font-size:12px}.role.selected{background:var(--green);color:white}.edit-row{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.edit-row label{margin:0}.edit-row .btn{padding:8px 12px;font-size:12px}select{font:inherit;display:block;width:100%;margin-top:8px;padding:12px;background:white;color:var(--ink);border:1px solid var(--line);border-radius:9px}.pink{background:#f4e5dd}#identity:empty{display:none}@media(max-width:600px){header{flex-wrap:wrap}aside{padding:18px 16px 0}.progress{gap:5px;align-items:flex-start}.progress li{flex:1;flex-direction:column;font-size:10px;text-align:center;gap:5px}.progress li span{width:22px;height:22px}.edit-row{grid-template-columns:1fr;gap:10px}.edit-row .btn{justify-self:end}main{padding-top:24px}}
</style></head><body><header><span class="brand">Situation<span>SHIT</span> ↗</span><div class="row"><div id="identity" class="row"></div><span class="tag">交互原型 · 模拟数据</span></div></header><div class="layout"><aside><nav id="nav" aria-label="建立关系进度"></nav></aside><main id="main"></main></div><footer><span>约定需要双方同意，结束也有明确的处理方式。</span><span>本地 mock · 无真实签署或资金交易</span></footer><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $=q=>document.querySelector(q), esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({stage:'home',actor:0,rules:[{id:'reply',kind:'reply',text:'正式确认后，7 天内回应',value:7},{id:'meet',kind:'meet',text:'每月至少见面 2 次',value:2},{id:'check',kind:'check',text:'每 14 天确认一次关系',value:14}],fund:50,bond:20,friends:['小夏','阿哲','安安'],signed:[false,false],paid:[false,false],version:1,pending:null,confirmation:null,claim:null,endBy:null,ended:false,accused:null,serial:0,history:[]});
let s=fresh(),draft=null,editing=false,timer; const clone=v=>JSON.parse(JSON.stringify(v)), who=i=>i===0?'A':'B', other=()=>1-s.actor, money=v=>Number(v).toLocaleString('zh-CN',{maximumFractionDigits:2});
const btn=(t,a,d=false,alt=false)=>`<button type="button" class="btn ${alt?'secondary':''}" data-action="${a}" ${d?'disabled':''}>${t}</button>`;
const title=(k,t,p)=>`<div class="eyebrow">${k}</div><h1>${t}</h1><p class="lead">${p}</p>`, list=rs=>rs.map(r=>`<div class="rule row"><span>${esc(r.text)}</span><span class="pill">${r.kind==='reply'?'失联规则':'共同约定'}</span></div>`).join('');
const reply=()=>s.rules.find(r=>r.kind==='reply'), openConfirm=()=>s.confirmation&&s.confirmation.status!=='responded', locked=()=>s.pending||s.claim||openConfirm()||s.endBy!==null||s.ended;
const details=()=>'<details><summary>原型与链上详情</summary><p>本地模拟，刷新重置。身份切换不是认证，未连接钱包，没有真实签名、资金交易或哈希。正式链上功能与未定业务规则另行确认。</p></details>';
function msg(t){$('#toast').textContent=t;clearTimeout(timer);timer=setTimeout(()=>$('#toast').textContent='',5000)}
function go(p){history.replaceState(null,'','#'+p);render(p);window.scrollTo(0,0)}
function safe(p){if(s.ended)return 'ended';if(s.stage==='home')return 'home';if(s.stage==='create')return 'create';if(s.stage==='setup')return 'setup';if(s.stage==='sign')return 'sign';if(s.stage==='deposit')return 'deposit';if(p==='edit'&&draft&&!locked())return p;if(p==='claim'&&!locked())return p;if(p==='dispute'&&s.claim)return p;if(p==='friends'&&s.claim?.phase==='voting')return p;return 'relationship'}
function syncDraft(){document.querySelectorAll('[data-rule]').forEach(el=>{let r=draft.find(x=>x.id===el.dataset.rule);if(!r)return;if(r.kind==='custom')r.text=el.value;else{r.value=el.value;r.text=r.kind==='reply'?`正式确认后，${el.value} 天内回应`:r.kind==='meet'?`每月至少见面 ${el.value} 次`:`每 ${el.value} 天确认一次关系`;}})}
function editor(){return `<form id="rules-form"><section class="card"><h2>${editing?'修订草稿':'先从这些事情聊起'}</h2><p class="note">可以删除示例，也可以添加自己的约定。至少保留一条。</p>${draft.map(r=>`<div class="rule edit-row"><label>${r.kind==='custom'?'自定义约定':{reply:'正式确认后的回复期限（天）',meet:'每月至少见面次数',check:'关系确认间隔（天）'}[r.kind]}${r.kind==='custom'?`<input data-rule="${r.id}" maxlength="160" value="${esc(r.text)}" required placeholder="例如：临时取消见面时提前告诉对方">`:`<input data-rule="${r.id}" type="number" min="1" max="${r.kind==='meet'?31:365}" value="${r.value}" required>`}</label>${btn('删除这条约定','remove:'+r.id,draft.length===1,true)}</div>`).join('')}<div class="actions">${btn('＋ 添加一条约定','add',draft.length>=12,true)}</div></section><p class="note">${editing?'另一方确认之前，原约定继续有效。此次修改不涉及资金或监督人。':'未定义裁决规则的约定可以提交申诉，但不会自动转移资金。'}</p><div class="actions">${btn(editing?'取消修改':'返回首页','backRules',false,true)}<button class="btn" type="submit">${editing?'确认修改，发送给对方':'下一步：资金与好友 →'}</button></div></form>`}
function funds(){return `<section class="card"><h2>双方存入的资金</h2>${[0,1].map(i=>`<div class="rule row"><b>${who(i)}${i===s.actor?'（你）':''}</b><span>恢复基金 ${s.paid[i]?money(s.fund):0} USDC</span><span>保证金 ${s.paid[i]?money(s.bond):0} USDC</span></div>`).join('')}<p class="note">恢复基金始终归本人。正常结束各自返还保证金；认定违约后，违约方保证金按约定转给另一方。</p></section>`}
function render(request){let p=safe(request||location.hash.slice(1));if(location.hash!=='#'+p)history.replaceState(null,'','#'+p);let step={home:-1,create:0,setup:1,sign:2,deposit:3}[p]??4;
$('#nav').innerHTML=p==='home'?'':`<ol class="progress">${['填写约定','资金与好友','双方签署','存入资金','关系已建立'].map((t,i)=>`<li class="${i===step?'current':i<step?'complete':''}" ${i===step?'aria-current="step"':''}><span>${i<step?'✓':i+1}</span>${t}</li>`).join('')}</ol>`;
$('#identity').innerHTML=['sign','deposit','active'].includes(s.stage)||s.ended?`<span class="note">模拟身份</span>${[0,1].map(i=>`<button class="role ${s.actor===i?'selected':''}" data-action="actor:${i}" ${p==='edit'||p==='claim'?'disabled':''}>${who(i)}${s.actor===i?' · 当前':''}</button>`).join('')}`:'';let h='';
if(p==='home')h=`<section class="hero"><div><div class="eyebrow">SITUATIONSHIT / 从一次沟通开始</div><h1>还没确定关系，<br>也可以<span style="color:#7d926c">聊聊期待。</span></h1><p class="lead">多久回消息、多久见一次面，你们可以一起商量。写下约定，再邀请对方确认和签署。</p><div class="actions">${btn('开始一段关系 →','start')}</div><p class="note">接下来依次填写约定、确认资金和好友，再由双方签署。</p></div><div class="art" role="img" aria-label="两个相互靠近的抽象人物"><div class="orb"></div><div class="orb two"></div><span class="heart">♡</span><div class="sticker">你怎么想？我们聊聊。</div></div></section><section class="card"><h2>约定可以一起调整</h2><p>建立关系后，可以新增或删除约定。另一方确认后，新版本才生效。有分歧时，可以针对具体约定发起申诉。</p><p class="note">本地交互演示，刷新重置，无真实资金交易。</p></section>`;
if(p==='create'||p==='edit'){if(!draft)draft=clone(s.rules);h=title(editing?'修订约定':'第 1 步 / 填写约定',editing?'有些约定想调整？':'写下你们的期待',editing?'提出你的修改，等对方确认。现有约定不会被单方面更改。':'从示例开始，也可以补充你们在意的事。')+editor()}
if(p==='setup')h=title('第 2 步 / 资金与好友','把金额和好友名单也说好','这些内容会和约定一起交给对方确认。')+`<form id="setup-form"><div class="grid"><section class="card"><h2>每人存入的金额</h2><label>恢复基金（USDC）<input name="fund" type="number" min="0.01" max="10000" step="0.01" value="${s.fund}" required></label><label>承诺保证金（USDC）<input name="bond" type="number" min="0.01" max="10000" step="0.01" value="${s.bond}" required></label><p class="note">原型采用双方同额、整笔入金；正式限制待确认。</p></section><section class="card"><h2>三位信任的好友</h2>${s.friends.map((n,i)=>`<label>${['A 指定','B 指定','双方共同指定'][i]}<input name="f${i}" maxlength="30" value="${esc(n)}" required></label>`).join('')}<p class="note">名单需双方同意。好友只查看争议必要的信息。</p></section></div><div class="actions">${btn('上一步：修改约定','backSetup',false,true)}<button class="btn" type="submit">下一步：查看并签署 →</button></div></form>`;
if(p==='sign')h=title('第 3 步 / 双方签署','这份约定，你们都同意吗？',`当前为 ${who(s.actor)}。核对内容后，确认自己的签署。`)+`<section class="card"><div class="row"><h2>关系协议 · 第 1 版</h2><span class="pill">${s.signed.filter(Boolean).length} / 2 已签署</span></div>${list(s.rules)}<div class="rule">每人恢复基金 ${money(s.fund)} USDC · 保证金 ${money(s.bond)} USDC</div><p>监督团：${s.friends.map(esc).join(' · ')}</p><div class="row">${[0,1].map(i=>`<span>${who(i)}：${s.signed[i]?'已模拟签署':'待签署'}</span>`).join('')}</div><div class="actions">${btn(`${who(s.actor)} 确认并签署`,'sign',s.signed[s.actor])}${s.signed[s.actor]&&!s.signed[other()]?btn(`切换到 ${who(other())} 查看协议`,'actor:'+other(),false,true):''}</div><p class="note">同一设备切换身份演示双方操作，不生成真实签名或跨设备邀请。</p></section>${!s.signed.some(Boolean)?btn('返回修改','backSign',false,true):'<p class="note">已有签署，协议已锁定；建立关系后可提出修订。</p>'}`;
if(p==='deposit')h=title('第 4 步 / 存入资金','双方已签署，接下来各自存入',`当前为 ${who(s.actor)}，应存入 ${money(s.fund+s.bond)} USDC。`)+funds()+`<section class="card lime"><h2>恢复基金 ${money(s.fund)} + 保证金 ${money(s.bond)}</h2><p>${s.paid[s.actor]?'你已模拟存入，等待另一方。':'两类资金分别记账，本次仅模拟操作。'}</p><div class="actions">${btn(`${who(s.actor)} 模拟存入 ${money(s.fund+s.bond)} USDC`,'deposit',s.paid[s.actor])}${s.paid[s.actor]?btn(`切换到 ${who(other())} 继续`,'actor:'+other(),false,true):''}</div></section>`;
if(p==='relationship'){h=title('我们的关系',`你好，${who(s.actor)}。`,'约定已经建立。查看当前内容，或就需要调整的地方和对方沟通。')+`<section class="card green"><div class="row"><h2>关系${s.claim?'争议中':s.endBy!==null?'待结束':'进行中'}</h2><span class="pill">约定第 ${s.version} 版</span></div><div class="avatars"><span class="avatar">A</span><span class="avatar">B</span></div><p>刚刚建立 · 本地演示</p></section>`;
if(s.pending)h+=`<section class="card lime"><h2>${who(s.pending.by)} 提出了约定修改</h2><p>新版本尚未生效，当前仍沿用第 ${s.version} 版。</p><h3>建议修改为</h3>${list(s.pending.rules)}<div class="actions">${s.pending.by!==s.actor?btn('同意修改，确认新版本','approveRevision')+btn('暂不同意，保留原约定','rejectRevision',false,true):btn('撤回修改提案','withdrawRevision',false,true)}</div></section>`;
h+=`<section class="card"><div class="row"><h2>当前生效的约定</h2><span class="pill">${s.rules.length} 条</span></div>${list(s.rules)}<div class="actions">${btn('增减或修改约定','editRules',!!locked(),true)}${btn('申诉对方违约','newClaim',!!locked())}</div>${locked()?'<p class="note">请先处理当前修订、确认、申诉或结束请求，再修改约定或发起新申诉。</p>':''}</section>`;
if(s.claim)h+=`<section class="card pink"><h2>有一项${s.claim.kind==='reply'?'失联':'约定'}申诉正在处理</h2><p>${who(s.claim.by)} 对 ${who(s.claim.accused)} 发起申诉 · 第 ${s.claim.version} 版</p><p>${esc(s.claim.rule.text)}</p>${btn('查看申诉与回应','viewClaim')}</section>`;
if(s.confirmation&&!s.claim)h+=`<section class="card"><h2>正式确认</h2><p>${who(s.confirmation.by)} → ${who(s.confirmation.to)} · ${s.confirmation.days} 天回复期限</p><p>${{waiting:'正在等待回应',expired:'示例期限已过，尚未回应',responded:'已在期限内回应，本次不能申诉失联'}[s.confirmation.status]}</p><div class="actions">${s.actor===s.confirmation.to?btn('回应正式确认','respond',s.confirmation.status!=='waiting'):btn('对本次失联发起申诉','ghostClaim',s.confirmation.status!=='expired')}</div>${s.confirmation.status==='waiting'?`<details><summary>演示时间控制</summary>${btn('模拟超过回复期限','expire',false,true)}</details>`:''}</section>`;
h+=funds()+`<section class="card"><h2>关系的下一步</h2><div class="actions">${reply()?btn('发起正式确认','confirm',!!locked()||!!s.confirmation):''}${btn('提出结束关系','requestEnd',!!locked(),true)}</div>${s.endBy!==null?`<p style="margin-top:18px">${who(s.endBy)} 已提出结束，资金尚未结算。</p><div class="actions">${s.endBy!==s.actor?btn('同意结束，各自取回资金','acceptEnd')+btn('暂不同意结束','rejectEnd',false,true):btn('撤回结束请求','withdrawEnd',false,true)}</div>`:''}</section>`;if(s.history.length)h+=`<details><summary>最近的处理记录</summary>${s.history.map(t=>`<p>${esc(t)}</p>`).join('')}</details>`;h+=details();}
if(p==='claim')h=title('发起申诉',`你认为 ${who(other())} 违反了哪条约定？`,'选择当前生效的约定，说明具体情况。提交申诉不等于认定对方违约。')+`<form id="claim-form"><section class="card"><label>申诉依据 · 第 ${s.version} 版<select name="rule" required>${s.rules.map(r=>`<option value="${r.id}">${esc(r.text)}</option>`).join('')}</select></label><label>发生了什么？<textarea name="reason" maxlength="1000" required placeholder="请用虚构内容演示，不要填写真实隐私"></textarea></label><p id="claim-hint" class="note"></p></section><div class="actions">${btn('取消，返回关系主页','homeRelation',false,true)}<button class="btn" id="submit-claim" type="submit">提交申诉给对方</button></div></form>`;
if(p==='dispute'){let c=s.claim;h=title('申诉详情',c.phase==='voting'?'好友监督处理中':'先听听双方的说法',`${who(c.by)} 发起 · ${who(c.accused)} 被申诉 · 依据第 ${c.version} 版约定`)+`<section class="card"><span class="pill">${c.kind==='reply'?'失联申诉':'一般约定申诉'}</span><h2 style="margin-top:18px">${esc(c.rule.text)}</h2><p style="white-space:pre-wrap">${esc(c.reason)}</p>${c.kind==='reply'?`<p class="note">正式确认已发送 · ${c.rule.value} 天回复期限 · 已模拟超期 · 无回应</p>`:''}<p>对方回应：${c.response?esc(c.response):'尚未回应'}</p></section>`;if(c.phase==='open'&&s.actor===c.accused)h+=`<form id="response-form" class="card"><label>你的回应<textarea name="response" maxlength="1000" required placeholder="补充情况或说明你不同意的地方">${esc(c.response)}</textarea></label><button class="btn" type="submit">发送回应</button><p class="note">回应会展示给另一方，不会自动认定违约或转移资金。</p></form>`;h+=`<div class="actions">${btn('返回关系主页','homeRelation',false,true)}${c.phase==='open'&&s.actor===c.by?btn('撤回本次申诉','withdrawClaim',false,true):''}${c.phase==='open'&&s.actor===c.by&&c.kind==='reply'?btn('演示：提交好友监督','submitVoting'):''}${c.phase==='voting'?btn('查看好友投票','viewVoting'):''}</div><p class="note">${c.kind==='reply'?'转交时机、迟到回应效力等规则待确认；好友监督只演示原型阶段。':'这类约定的证据标准和资金后果尚未定义；可以提交与回应，不自动裁决或结算。'}</p>`;}
if(p==='friends'){let c=s.claim;h=title('好友监督 / 模拟身份','请根据争议信息判断','只展示本次失联争议必要信息。以下三个区域分别模拟指定好友。')+`<section class="card"><p>${who(c.by)} 发起正式确认，${who(c.accused)} 未在 ${c.rule.value} 天示例期限内回应。</p><p>申诉依据：第 ${c.version} 版 · ${esc(c.rule.text)}</p><p class="note">无额外授权证据，不展示聊天、照片或位置。</p></section><section class="card lime"><h2>${c.votes.filter(v=>v===true).length} / 3 票认定违约</h2>${s.friends.map((n,i)=>`<div class="rule"><b>${esc(n)} · ${['A 指定','B 指定','共同指定'][i]}</b><p>${c.votes[i]===null?'待投票':c.votes[i]?'已投：构成违约':'已投：不构成违约'}</p><div class="actions">${btn('构成违约','voteYes:'+i,c.votes[i]!==null)}${btn('不构成违约','voteNo:'+i,c.votes[i]!==null,true)}</div></div>`).join('')}<p class="note">不足两票不能违约结算。否决、缺席或超时规则待确认。</p></section>${btn('返回申诉详情','viewClaim',false,true)}`;}
if(p==='ended')h=title('关系已结束','查看资金去向',s.accused!==null?`模拟裁决：${who(s.accused)} 被认定违约。`:'双方已确认正常结束。')+`<section class="card receipt"><span class="pill">模拟结算 · 无真实转账</span>${[0,1].map(i=>{let own=s.accused===i?0:s.bond,extra=s.accused!==null&&s.accused!==i?s.bond:0;return `<div class="rule"><div class="row"><b>${who(i)} 收到</b><b class="big">${money(s.fund+own+extra)} <span class="unit">USDC</span></b></div><p class="note">恢复基金 ${money(s.fund)} + 本人保证金 ${money(own)} + 对方保证金 ${money(extra)}</p></div>`}).join('')}<p>总存入 / 总分配：${money(2*(s.fund+s.bond))} / ${money(2*(s.fund+s.bond))} USDC</p><p class="note">此场景已结束，不再接受修订、入金或重复结算。</p></section>${details()}`;
$('#main').innerHTML=h;if(p==='claim')hint();}
function canGhost(){return s.confirmation&&s.confirmation.by===s.actor&&s.confirmation.status==='expired'&&!s.claim&&!s.pending&&s.endBy===null}
function hint(){let el=$('[name=rule]');if(!el)return;let r=s.rules.find(x=>x.id===el.value),ghost=r?.kind==='reply';$('#claim-hint').textContent=ghost?(canGhost()?'正式确认已超期且未回应，可以申诉。':'先返回主页发起正式确认；超过回复期限且没有回应后，才能提出失联申诉。'):'可以提交并听取对方回应；裁决标准未定义，不会自动转移资金。';$('#submit-claim').disabled=ghost&&!canGhost()}
function createClaim(r,reason){if(s.stage!=='active'||s.ended||s.claim||s.pending||s.endBy!==null)return;if(r.kind==='reply'&&!canGhost())return msg('尚不满足失联申诉条件。');if(r.kind!=='reply'&&openConfirm())return msg('请先处理当前正式确认。');s.claim={by:s.actor,accused:other(),kind:r.kind,rule:clone(r),version:s.version,reason,response:'',phase:'open',votes:[null,null,null]};go('dispute')}
document.addEventListener('input',e=>{if(e.target.dataset.rule&&draft)syncDraft()});document.addEventListener('change',e=>{if(e.target.name==='rule')hint()});
document.addEventListener('submit',e=>{if(!['rules-form','setup-form','claim-form','response-form'].includes(e.target.id))return;e.preventDefault();let f=new FormData(e.target);
if(e.target.id==='rules-form'){syncDraft();if(draft.some(r=>!r.text.trim()))return msg('请填写每条约定。');draft.forEach(r=>{r.text=r.text.trim();if(r.kind!=='custom')r.value=Number(r.value)});if(editing){if(locked())return;if(JSON.stringify(draft)===JSON.stringify(s.rules))return msg('约定没有变化。');s.pending={by:s.actor,rules:clone(draft)};draft=null;editing=false;go('relationship')}else{s.rules=clone(draft);s.stage='setup';go('setup')}}
if(e.target.id==='setup-form'){let friends=[0,1,2].map(i=>String(f.get('f'+i)).trim());if(friends.some(x=>!x)||new Set(friends).size!==3)return msg('请填写三位不同的好友。');s.fund=Number(f.get('fund'));s.bond=Number(f.get('bond'));s.friends=friends;s.stage='sign';s.actor=0;go('sign')}
if(e.target.id==='claim-form'){let reason=String(f.get('reason')).trim();if(!reason)return msg('请填写申诉说明。');let r=s.rules.find(x=>x.id===f.get('rule'));if(r)createClaim(r,reason)}
if(e.target.id==='response-form'&&s.claim?.phase==='open'&&s.actor===s.claim.accused){let response=String(f.get('response')).trim();if(!response)return msg('请填写回应。');s.claim.response=response;go('dispute');msg('回应已展示给对方。')}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let a=b.dataset.action;
if(a==='start'){s=fresh();s.stage='create';draft=clone(s.rules);editing=false;return go('create')}
if(a.startsWith('actor:')){if(['sign','deposit','active'].includes(s.stage)||s.ended){s.actor=Number(a.split(':')[1]);render()}return}
if(a==='add'&&draft){syncDraft();if(draft.length<12)draft.push({id:'custom'+(++s.serial),kind:'custom',text:''});return render()}
if(a.startsWith('remove:')&&draft){syncDraft();if(draft.length>1)draft=draft.filter(r=>r.id!==a.slice(7));return render()}
if(a==='backRules'){if(editing){draft=null;editing=false;return go('relationship')}s.stage='home';return go('home')}
if(a==='backSetup'){let f=new FormData($('#setup-form'));s.fund=f.get('fund');s.bond=f.get('bond');s.friends=[0,1,2].map(i=>String(f.get('f'+i)));draft=clone(s.rules);s.stage='create';return go('create')}
if(a==='backSign'&&!s.signed.some(Boolean)){s.stage='setup';return go('setup')}
if(a==='sign'&&s.stage==='sign'){s.signed[s.actor]=true;if(s.signed.every(Boolean)){s.stage='deposit';return go('deposit')}return render()}
if(a==='deposit'&&s.stage==='deposit'&&s.signed.every(Boolean)){s.paid[s.actor]=true;if(s.paid.every(Boolean)){s.stage='active';return go('relationship')}return render()}
if(s.stage!=='active'||s.ended)return;
if(a==='homeRelation')return go('relationship');
if(a==='editRules'&&!locked()){draft=clone(s.rules);editing=true;return go('edit')}
if(a==='approveRevision'&&s.pending&&s.pending.by!==s.actor){s.rules=clone(s.pending.rules);s.pending=null;s.version++;s.confirmation=null;s.history.unshift(`双方确认第 ${s.version} 版约定。`);return go('relationship')}
if(a==='rejectRevision'&&s.pending&&s.pending.by!==s.actor){s.pending=null;s.history.unshift('修改未获同意，原约定保持有效。');return go('relationship')}
if(a==='withdrawRevision'&&s.pending?.by===s.actor){s.pending=null;return go('relationship')}
if(a==='newClaim'&&!locked())return go('claim');
if(a==='confirm'&&!locked()&&!s.confirmation&&reply()){s.confirmation={by:s.actor,to:other(),days:reply().value,status:'waiting'};return go('relationship')}
if(a==='respond'&&s.confirmation?.to===s.actor&&s.confirmation.status==='waiting'&&!s.claim){s.confirmation.status='responded';return go('relationship')}
if(a==='expire'&&s.confirmation?.status==='waiting'&&!s.claim){s.confirmation.status='expired';return go('relationship')}
if(a==='ghostClaim'&&canGhost())return createClaim(reply(),`正式确认超过 ${s.confirmation.days} 天示例期限，仍未收到回应。`);
if(a==='viewClaim'&&s.claim)return go('dispute');
if(a==='withdrawClaim'&&s.claim?.by===s.actor&&s.claim.phase==='open'){s.history.unshift(`第 ${s.claim.version} 版申诉已由 ${who(s.actor)} 撤回。`);s.claim=null;s.confirmation=null;return go('relationship')}
if(a==='submitVoting'&&s.claim?.by===s.actor&&s.claim.kind==='reply'&&s.claim.phase==='open'){if(s.claim.response)return msg('对方已回应，其效力规则待确认；当前不进入自动结算演示。');s.claim.phase='voting';return go('friends')}
if(a==='viewVoting'&&s.claim?.phase==='voting')return go('friends');
if(/^vote(Yes|No):[0-2]$/.test(a)&&s.claim?.phase==='voting'){let i=Number(a.split(':')[1]);if(s.claim.votes[i]!==null)return;s.claim.votes[i]=a.startsWith('voteYes');if(s.claim.votes.filter(v=>v===true).length>=2){s.accused=s.claim.accused;s.ended=true;return go('ended')}return render()}
if(a==='requestEnd'&&!locked()){s.endBy=s.actor;return go('relationship')}
if(a==='acceptEnd'&&s.endBy!==null&&s.endBy!==s.actor&&!s.claim){s.ended=true;return go('ended')}
if(a==='rejectEnd'&&s.endBy!==null&&s.endBy!==s.actor){s.endBy=null;s.history.unshift('结束请求未获双方确认，关系继续。');return go('relationship')}
if(a==='withdrawEnd'&&s.endBy===s.actor){s.endBy=null;return go('relationship')}
});window.addEventListener('hashchange',()=>render());render();
</script></body></html>
